name: Build Flutter iOS IPA

on:
  push:
    branches: [ "main" ]  # Chạy tự động khi bạn push code lên branch main
  workflow_dispatch:      # Bật nút bấm thủ công trên GitHub

jobs:
  build-ios:
    runs-on: macos-14    # Dùng máy chủ Mac ảo của GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app to .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r AloT-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AloT-iOS-IPA
          path: AloT-unsigned.ipa
          retention-days: 7